<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa Infinita — RPG narrado por IA</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#121a24;--p:#1b2735;--l:#2f4156;--t:#e6e2d6;--m:#8a9aab;--a:#f2b84b;--ok:#6fcf97;--ko:#eb6b5e}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,sans-serif}
#app{max-width:780px;margin:0 auto;padding:12px}main{padding-bottom:110px}
h1,h3{font-family:Spectral,Georgia,serif;margin:.2em 0}h1{font-size:26px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
button,input,select,textarea{font:inherit;color:inherit;background:var(--p);border:1px solid var(--l);border-radius:6px;padding:8px 10px}
input,select,textarea{width:100%}textarea{resize:vertical}
input:disabled,select:disabled,textarea:disabled{opacity:.65}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--a)}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--a);color:#1a1205;border-color:var(--a);font-weight:600}
label{display:block;margin:8px 0;color:var(--m);font-size:13px}label>*{margin-top:3px;color:var(--t)}
.card{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:12px;margin:10px 0}
.card input,.card textarea,.card select{background:var(--bg)}
.m{color:var(--m)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{display:flex;gap:6px;margin:8px 0}nav button{flex:1;border-radius:999px}nav .on{border-color:var(--a);color:var(--a)}
.chip{display:inline-block;padding:2px 10px;border:1px solid var(--l);border-radius:999px;font-size:13px;margin:2px;background:var(--p)}
.chip img{width:18px;height:18px;border-radius:50%;vertical-align:-4px;margin-right:4px}
.chip.off{opacity:.4}.chip.cur,.chip.sel{background:var(--a);color:#1a1205;border-color:var(--a);font-weight:600}
.ib{margin:8px 0;padding:8px;border:1px dashed var(--a);border-radius:8px;text-align:center}.ap{text-align:left}
.log{height:48vh;overflow:auto;background:var(--p);border-radius:10px;padding:6px 14px}.log p{margin:.7em 0}
.nar{font:17px/1.6 Spectral,Georgia,serif;white-space:pre-wrap;border-left:3px solid var(--a);padding-left:10px}
.act{color:#8fd3c8}
.rl{font-size:13px;background:var(--bg);border-radius:6px;padding:4px 8px;display:inline-block}.rl.ok{color:var(--ok)}.rl.ko{color:var(--ko)}
.req{background:#f2b84b1f;border:1px solid var(--a);border-radius:8px;padding:6px 10px;font-weight:600}
.typ{color:var(--m);font-style:italic;display:flex;align-items:center;gap:8px}
.spk{color:var(--a);font-style:normal;display:inline-block;animation:rot 2s linear infinite}
.dots b{display:inline-block;width:5px;height:5px;margin:0 2px;border-radius:50%;background:var(--a);animation:bn 1.2s infinite}
.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
@keyframes rot{to{transform:rotate(360deg)}}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.btns button{flex:1}
.cd{border-top:1px solid var(--l);padding-top:8px;margin-top:8px}
.ar{display:grid;grid-template-columns:1fr auto 3ch auto;gap:8px;align-items:center;margin:6px 0}.ar span{text-align:center;font-weight:600}
.bar{position:relative;height:18px;background:var(--bg);border-radius:9px;overflow:hidden;margin:4px 0}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .4s}.bar span{position:relative;font-size:12px;padding-left:8px;line-height:18px;text-shadow:0 1px 2px #000}
.hd{display:flex;gap:12px;align-items:center}.av{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--bg);border:2px solid var(--l);cursor:pointer;display:grid;place-items:center;flex:none;overflow:hidden}
#roll{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px;display:flex;justify-content:center;pointer-events:none}
.rq{pointer-events:auto;max-width:760px;width:100%;background:var(--p);border:2px solid var(--a);border-radius:14px;padding:12px;text-align:center;animation:gl 1.4s infinite}
.rq h2{margin:0;font:600 22px Spectral,serif;color:var(--a)}.rq p{margin:4px 0}.rq button{width:100%;font-size:18px;padding:12px;margin-top:6px}.rq.w{animation:none;border-color:var(--l);padding:8px}
@keyframes gl{0%,100%{box-shadow:0 0 0 0 #f2b84b88}50%{box-shadow:0 0 22px 4px #f2b84b88}}
#toast{position:fixed;bottom:110px;left:50%;transform:translate(-50%,20px);background:var(--a);color:#1a1205;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
#dice{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:9}#dice.on{display:grid}
.dw{text-align:center}.dw p{margin:8px 0;font-size:18px;min-height:1.5em}#dr{font-weight:700;font-size:20px}
.die{position:relative;width:140px;height:140px;margin:auto}.die svg{position:absolute;inset:0;width:100%;height:100%}
.f{fill:var(--a);transition:fill .3s}#dn{position:absolute;inset:0;display:grid;place-items:center;color:#1a1205;font:700 42px Spectral,serif}
.die.roll{animation:tb 1s cubic-bezier(.3,.6,.4,1) both}.die.land{animation:ld .45s ease-out}
@keyframes tb{0%{transform:translateY(-140px) rotate(0) scale(.6)}40%{transform:translateY(0) rotate(420deg) scale(1.1)}55%{transform:translateY(-45px) rotate(560deg)}75%{transform:translateY(0) rotate(680deg)}100%{transform:rotate(720deg)}}
@keyframes ld{0%{transform:scale(1.35)}60%{transform:scale(.94)}100%{transform:scale(1)}}
#dice.ok .f{fill:var(--ok)}#dice.ko .f{fill:var(--ko)}#dice.n1 .f{fill:#a33}#dice.n20 .f{fill:#ffe08a}#dice.n20 .die{filter:drop-shadow(0 0 24px #ffd54a)}
#dice.ok #dr{color:var(--ok)}#dice.ko #dr,#dice.n1 #dr{color:var(--ko)}#dice.n20 #dr{color:#ffe08a}
@media(prefers-reduced-motion:reduce){.die.roll,.spk,.dots b,.rq{animation:none}}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<div id="dice"><div class="dw"><div class="die" id="dv"><svg viewBox="0 0 100 100"><polygon class="f" points="50,3 93,27 93,73 50,97 7,73 7,27"/><path d="M50 24 78 66H22Z M50 3V24M50 24 7 27M50 24 93 27M22 66 7 73M78 66 93 73M22 66 50 97M78 66 50 97" fill="none" stroke="#1a1205" stroke-width="2" stroke-linejoin="round"/></svg><b id="dn"></b></div><p id="dl"></p><p id="dr"></p></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));
let uid=LS('uid');if(!uid)LS('uid',uid=Math.random().toString(36).slice(2,10));
const PV={openai:{n:'OpenAI',u:'https://api.openai.com/v1'},openrouter:{n:'OpenRouter',u:'https://openrouter.ai/api/v1'},anthropic:{n:'Anthropic (Claude)'},gemini:{n:'Google Gemini'},groq:{n:'Groq',u:'https://api.groq.com/openai/v1'},mistral:{n:'Mistral',u:'https://api.mistral.ai/v1'},deepseek:{n:'DeepSeek',u:'https://api.deepseek.com/v1'},xai:{n:'xAI (Grok)',u:'https://api.x.ai/v1'},together:{n:'Together',u:'https://api.together.xyz/v1'},custom:{n:'Outro (compatível com OpenAI)'}};
const VB=['Tecendo o destino','Consultando as lendas','Embaralhando o destino','Forjando a narrativa','Afiando as espadas','Computando','Quantificando','Carregando','Escrevendo','Invocando o narrador','Rolando dados no escuro','Acendendo as tochas'];
let cfg=Object.assign({p:'openai',ks:{},m:'',u:'',ms:[]},LS('cfg')),nm=LS('nm')||'',tab='world',view='',peer,hc,isHost=false,room='',conns={},mkey='',built=false,rolling=false,lastPh=null,tt=null;
let S={phase:'lobby',world:{name:'',desc:'',power:'',attrs:'Força: dano físico e façanhas\nAgilidade: reflexos, furtividade, mira\nMente: magia, conhecimento, percepção\nPresença: carisma e vontade',skills:'Furtividade\nPersuasão\nPercepção\nAtletismo\nLuta\nArcanismo',pts:10,perLvl:3,skPts:6,skPerLvl:2,freePw:2,freeTr:1,init:'Agilidade',adv:''},cards:[],players:{},log:[],init:null,pend:null,busy:false,ap:0};
const K=()=>cfg.ks[cfg.p]||'',base=()=>cfg.p=='custom'?cfg.u.replace(/\/$/,''):PV[cfg.p].u;
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.i);toast.i=setTimeout(()=>t.className='',3500)};
const pj=t=>{try{return JSON.parse(t.match(/\{[\s\S]*\}/)[0])}catch(e){return null}};
const rd=(n,s)=>Array.from({length:n},()=>1+Math.floor(Math.random()*s)),rid=()=>Math.random().toString(36).slice(2,8);
const lines=t=>String(t).split('\n').map(l=>l.split(':')).filter(a=>a[0].trim()).map(a=>({n:a[0].trim(),d:a.slice(1).join(':').trim()})),attrs=()=>lines(S.world.attrs),skills=()=>lines(S.world.skills);
const t2=a=>Array.isArray(a)?a.map(x=>x.n?x.n+': '+(x.d||''):x).join('\n'):a;
const newSheet=()=>({lvl:1,xp:0,hp:20,mana:10,cname:'',gender:'',bio:'',avatar:'',ready:false,attrs:{},skills:{},powers:[],traits:[],inv:[]});
const sheet=()=>S.players[uid].sheet||(S.players[uid].sheet=newSheet());
const mx=s=>({hp:15+5*s.lvl,mp:5+5*s.lvl}),sum=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);
const free=s=>[(+S.world.pts||0)+(s.lvl-1)*(+S.world.perLvl||0)-sum(s.attrs),(+S.world.skPts||0)+(s.lvl-1)*(+S.world.skPerLvl||0)-sum(s.skills)];
const find=(o,n)=>Object.keys(o||{}).find(a=>a.toLowerCase()==String(n||'').toLowerCase());
function bk(s,p){let b=0,t=[];const a=find(s.attrs,p.stat),k=find(s.skills,p.skill);if(a){b+=s.attrs[a];t.push(s.attrs[a]+' '+a)}if(k&&s.skills[k]){b+=s.skills[k];t.push(s.skills[k]+' '+k)}if(p.pb){b+=p.pb;t.push(p.pb+' poder')}return{b,t}}
const lab=p=>p?.sheet?.cname||p?.name,pn=i=>esc(S.players[i]?lab(S.players[i]):'?');
const who=w=>Object.values(S.players).find(p=>[p.sheet?.cname,p.name].some(x=>x&&x.toLowerCase()==String(w).toLowerCase()));

/* ---------- IA (chave só no navegador do mestre) ---------- */
const AH=()=>({'x-api-key':K(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'});
async function jf(url,o){const r=await fetch(url,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error?.message||JSON.stringify(d.error||d)||r.status);return d}
async function listModels(){
 if(cfg.p=='anthropic')return(await jf('https://api.anthropic.com/v1/models?limit=100',{headers:AH()})).data.map(x=>x.id);
 if(cfg.p=='gemini')return(await jf(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${K()}`)).models.filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')).map(x=>x.name.replace('models/',''));
 const r=await jf(base()+'/models',{headers:{Authorization:'Bearer '+K()}});return(r.data||r).map(x=>x.id).sort()}
async function ai(system,user){
 const m=cfg.m;if(!K()||!m)throw Error('configure provedor, chave e modelo na aba IA');
 if(cfg.p=='anthropic')return(await jf('https://api.anthropic.com/v1/messages',{method:'POST',headers:AH(),body:JSON.stringify({model:m,max_tokens:1800,system,messages:[{role:'user',content:user}]})})).content.map(x=>x.text||'').join('');
 if(cfg.p=='gemini')return(await jf(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${K()}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}]})})).candidates[0].content.parts.map(x=>x.text||'').join('');
 return(await jf(base()+'/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+K(),'content-type':'application/json'},body:JSON.stringify({model:m,messages:[{role:'system',content:system},{role:'user',content:user}]})})).choices[0].message.content}
const sys=()=>{const w=S.world;return `Você é o narrador (mestre) de um RPG de mesa multiplayer, em português do Brasil. Narre de forma vívida e concisa (até 2 parágrafos) e nunca controle as ações dos personagens dos jogadores. Chame os personagens pelo nome do personagem.
MUNDO: ${w.name}. ${w.desc}
SISTEMA DE PODER: ${w.power}
ATRIBUTOS:\n${w.attrs}
PERÍCIAS:\n${w.skills}
CARTÕES DE MEMÓRIA:\n${S.cards.map(c=>`- ${c.t}: ${c.x}`).join('\n')}
AVENTURA: ${w.adv}
REGRAS: PV máx = 15+5×nível; mana máx = 5+5×nível; sobe de nível com nível×100 XP. Se uma ação for incerta ou arriscada, NÃO resolva: peça rolagem. kind "check" = d20 + atributo (+ perícia, se couber) contra a CD (8 fácil, 12 média, 16 difícil, 20 muito difícil, 25 épica). kind "dice" = dano/efeito em dados (ex.: "2d6"). Se o jogador usar um poder de ataque, peça um check do atributo do poder (o nível do poder soma sozinho) e, após sucesso, um "dice" com o dado do poder; poderes de suporte aplicam efeitos, narre-os. Ações triviais: só narre. Nunca invente resultado de dados. Use "scene":true ao começar uma cena importante (combate, confronto) para todos rolarem iniciativa. Você pode dar XP (20 a 100 por conquista), itens e poderes novos quando fizer sentido na história, e tirar itens usados/consumidos.
Responda SOMENTE com JSON: {"narration":"...","roll":null ou {"kind":"check"|"dice","stat":"atributo","skill":"perícia ou vazio","dc":14,"dice":"2d6","why":"motivo curto"},"hp":[{"who":"Nome","delta":-3}],"mana":[{"who":"Nome","delta":-2}],"xp":[{"who":"Nome","n":50}],"items":[{"who":"Nome","n":"Poção","d":"efeito","q":1}],"remove":[{"who":"Nome","n":"Poção","q":1}],"powers":[{"who":"Nome","n":"...","d":"...","lvl":1,"stat":"atributo","kind":"atk"|"sup","dice":"2d6","cost":2}],"cards":[{"title":"...","text":"..."}],"scene":false}. Use só os campos necessários. Em "cards" registre fatos novos importantes.`};
function ctx(){
 const pl=Object.values(S.players).map(p=>{const s=p.sheet||newSheet(),o=x=>Object.entries(x).filter(a=>a[1]).map(([k,v])=>k+' '+v).join(', ');return `- ${lab(p)} (jogador ${p.name}${s.gender?', '+s.gender:''}; nível ${s.lvl}, XP ${s.xp}/${s.lvl*100}, PV ${s.hp}/${mx(s).hp}, mana ${s.mana}/${mx(s).mp}): ${s.bio||''}. Atributos: ${o(s.attrs)}. Perícias: ${o(s.skills)||'nenhuma'}. Poderes: ${s.powers.filter(x=>x.st=='ok').map(x=>`${x.n} [nv ${x.lvl}, ${x.kind=='sup'?'suporte':'ataque '+x.dice}, ${x.stat}, ${x.cost} mana] ${x.d}`).join('; ')||'nenhum'}. Propriedades: ${s.traits.filter(x=>x.st=='ok').map(x=>`${x.n}: ${x.d}`).join('; ')||'nenhuma'}. Inventário: ${s.inv.map(x=>`${x.q}× ${x.n}`).join(', ')||'vazio'}`}).join('\n'),T=S.init;
 const o=T&&!T.rolling?`Iniciativa: ${T.order.map(i=>lab(S.players[i])).join(' → ')}. Turno atual: ${lab(S.players[T.order[T.turn]])}.`:'';
 const lg=S.log.slice(-30).map(l=>({nar:'Narrador: '+l.x,say:lab(S.players[l.w])+' diz: '+l.x,act:lab(S.players[l.w])+' age: '+l.t,roll:'Dado: '+l.x}[l.k]||'')).filter(Boolean).join('\n');
 return `PERSONAGENS:\n${pl}\n${o}\n\nHISTÓRICO:\n${lg}`}

/* ---------- Lógica do jogo (só o mestre/host executa) ---------- */
const sync=()=>{S.log=S.log.slice(-150);for(const c of Object.values(conns))c.open&&c.send({t:'S',S});render()};
const tx=m=>isHost?handle(uid,m):hc?.open&&hc.send(m);
const log=(k,x,o)=>S.log.push({k,x,...o});
function startInit(){S.init={order:[],turn:0,rolling:true,rolls:{}};log('sys','⚔ Cena importante! Todos rolam a iniciativa.')}
function chkInit(){const T=S.init;if(!T||!T.rolling)return;const on=Object.keys(S.players).filter(i=>S.players[i].on);if(on.length&&on.every(i=>i in T.rolls)){T.order=on.sort((a,b)=>T.rolls[b]-T.rolls[a]);T.rolling=false;T.turn=0;log('sys','Ordem: '+T.order.map(i=>lab(S.players[i])).join(' → '))}}
const adv=()=>{const T=S.init;if(T&&!T.rolling)T.turn=(T.turn+1)%T.order.length};
function clean(u,n,o){ // o host é a autoridade: PV, mana, XP, nível e inventário não vêm do cliente
 o=Object.assign(newSheet(),o);const s={...o},h=u==uid;
 ['cname','gender','bio','avatar','ready'].forEach(k=>s[k]=n[k]);
 const f=free({...o,attrs:n.attrs,skills:n.skills});if(f[0]>=0&&f[1]>=0){s.attrs=n.attrs;s.skills=n.skills}
 ['powers','traits'].forEach(k=>s[k]=(n[k]||[]).map(x=>{const p=o[k].find(y=>y.id==x.id);return p&&p.st=='ok'&&!h?p:{...x,st:h?'ok':(p?.st||'pend')}}));
 return s}
function handle(u,d){
 const P=S.players[u],T=S.init,h=u==uid;if(!P)return;
 if(d.t=='sheet')P.sheet=clean(u,d.sheet,P.sheet);
 else if(d.t=='say')log('say',d.x,{w:u});
 else if(d.t=='appr'&&h){const a=S.players[d.w]?.sheet?.[d.k],i=a?a.findIndex(x=>x.id==d.id):-1;if(i>=0){const n=a[i].n;if(d.ok)a[i].st='ok';else a.splice(i,1);log('sys',`${lab(S.players[d.w])}: ${n} — ${d.ok?'aprovado ✔':'recusado ✘'}`)}}
 else if(d.t=='act'&&S.phase=='play'&&!S.busy&&!S.pend&&(!T||(!T.rolling&&T.order[T.turn]==u))){
  const s=P.sheet,pw=s.powers.find(x=>x.id==d.pw&&x.st=='ok'),it=s.inv.find(x=>x.n==d.it);
  if(pw&&pw.cost>s.mana){log('sys','Mana insuficiente para '+pw.n);return sync()}
  if(pw)s.mana-=pw.cost;S.ap=pw?pw.lvl:0;
  const full=(pw?`[poder ${pw.n}, nível ${pw.lvl}, ${pw.kind=='sup'?'suporte':'ataque, dano '+pw.dice}, atributo ${pw.stat}, custou ${pw.cost} mana: ${pw.d}] `:'')+(it?`[item ${it.n}: ${it.d}] `:'')+d.x;
  log('act',(pw?'⚡'+pw.n+' ':'')+(it?'🎒'+it.n+' ':'')+d.x,{w:u,t:full});return narrate(u,`${lab(P)} age: ${full}`)}
 else if(d.t=='roll'&&S.pend?.who==u&&!S.busy){const p=S.pend,ok=p.kind=='check'?d.total>=p.dc:null;S.pend=null;log('roll',d.txt,{w:u,ok});return narrate(u,`Resultado da rolagem de ${lab(P)}: ${d.txt}.${d.d==20?' (20 natural!)':d.d==1?' (1 natural!)':''}${ok===null?'':ok?' SUCESSO.':' FALHA.'} Narre a consequência.`)}
 else if(d.t=='ini'&&T?.rolling&&!(u in T.rolls)){T.rolls[u]=d.v;log('roll','Iniciativa — '+d.txt,{w:u});chkInit()}
 else if(d.t=='pass'&&T&&!T.rolling&&!S.busy&&!S.pend&&(T.order[T.turn]==u||h))adv();
 sync()}
async function narrate(actor,prompt){
 S.busy=true;sync();
 try{
  const r0=await ai(sys(),ctx()+'\n\n'+prompt),r=pj(r0)||{narration:r0};
  if(r.narration)log('nar',r.narration);
  const num=(a,f)=>(a||[]).forEach(f),P=x=>who(x.who),cl=(v,m)=>Math.max(0,Math.min(m,v));
  num(r.hp,h=>{const s=P(h)?.sheet;if(s)s.hp=cl(s.hp+(+h.delta||0),mx(s).hp)});
  num(r.mana,h=>{const s=P(h)?.sheet;if(s)s.mana=cl(s.mana+(+h.delta||0),mx(s).mp)});
  num(r.xp,x=>{const p=P(x),s=p?.sheet;if(!s||!+x.n)return;s.xp+=+x.n;log('sys',`✨ ${lab(p)} ganhou ${x.n} XP`);while(s.xp>=s.lvl*100){s.xp-=s.lvl*100;s.lvl++;s.hp=mx(s).hp;s.mana=mx(s).mp;log('sys',`🎉 ${lab(p)} subiu para o nível ${s.lvl}! Há novos pontos de atributo e perícia na ficha.`)}});
  num(r.items,i=>{const p=P(i),s=p?.sheet;if(!s||!i.n)return;const e=s.inv.find(y=>y.n.toLowerCase()==i.n.toLowerCase()),q=+i.q||1;e?e.q+=q:s.inv.push({n:i.n,d:i.d||'',q});log('sys',`🎒 ${lab(p)} recebeu ${q}× ${i.n}`)});

/* ---------- Rede P2P (PeerJS): o host é a "sala", ID = senha ---------- */
function mkRoom(){
 room=Math.random().toString(36).slice(2,8).toUpperCase();peer=new Peer('mesainf-'+room);
 peer.on('error',e=>e.type=='unavailable-id'?mkRoom():toast('Erro de conexão: '+e.type));
 peer.on('open',()=>{isHost=true;S.phase='setup';S.players[uid]={name:nm,on:true,sheet:newSheet()};enter()});
 peer.on('connection',c=>{
  c.on('data',d=>{
   if(d.t!='hi')return c.uid&&handle(c.uid,d);
   const ex=S.players[d.uid];
   if(!ex&&Object.keys(S.players).length>=4){c.send({t:'err',m:'Sala cheia (máx. 4 jogadores).'});return setTimeout(()=>c.close(),300)}
   c.uid=d.uid;conns[d.uid]=c;S.players[d.uid]={...(ex||{sheet:newSheet()}),name:d.name,on:true};log('sys',d.name+' entrou.');sync()});
  c.on('close',()=>{const p=S.players[c.uid];if(p&&conns[c.uid]==c){p.on=false;delete conns[c.uid];chkInit();sync()}})})}
function joinRoom(id){
 room=id.toUpperCase().trim();peer=new Peer();
 peer.on('error',e=>toast(e.type=='peer-unavailable'?'Sala não encontrada.':'Erro de conexão: '+e.type));
 peer.on('open',()=>{hc=peer.connect('mesainf-'+room,{reliable:true});
  hc.on('open',()=>hc.send({t:'hi',uid,name:nm}));
  hc.on('data',d=>{if(d.t=='err')toast(d.m);else if(d.t=='S'){S=d.S;built?render():enter()}});
  hc.on('close',()=>toast('Conexão com a sala encerrada.'))})}

 $('#dl').textContent=lb;$('#dr').textContent='';o.className='on';v.className='die roll';

 rolling=false}

${cfg.p=='custom'?`<label>URL base (ex.: https://meu-servidor/v1)<input data-cf=u value="${esc(cfg.u)}"></label>`:''}
<label>Chave de API<input type=password data-cf=k value="${esc(K())}" autocomplete=off></label><button id=loadm>Carregar modelos</button>
<label>Modelo<select data-cf=m>${(cfg.ms.length?cfg.ms:cfg.m?[cfg.m]:[]).map(x=>`<option ${x==cfg.m?'selected':''}>${esc(x)}</option>`).join('')}</select></label>
<small class=m>A chave fica só neste navegador. Só o mestre chama a IA; os outros jogadores não precisam de chave.</small></div>`;

/* ---------- Eventos ---------- */
const save=r=>{tx({t:'sheet',sheet:sheet()});if(r)render(1)};
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;const id=b.id,d=b.dataset;
 if(id=='bmk'||id=='bjn'){nm=$('#nm').value.trim();if(!nm)return toast('Digite seu nome.');LS('nm',nm);if(id=='bmk')mkRoom();else{const r=$('#rid').value.trim();if(r)joinRoom(r)}}
 else if(d.tab){tab=d.tab;mkey='';render(1)}
 else if(d.v){view=d.v;render(1)}
 else if(id=='rc'){navigator.clipboard?.writeText(room);toast('ID copiado: '+room)}
 else if(id=='bsay'){const x=$('#tx').value.trim();if(x){tx({t:'say',x});$('#tx').value=''}}
 else if(id=='bact'){const x=$('#tx').value.trim(),pw=$('#pw').value,it=$('#it').value;if(!x&&!pw&&!it)return;tx({t:'act',x,pw,it});$('#tx').value=''}
 else if(id=='bpass')tx({t:'pass'})
 else if(id=='broll')rollIt()
 else if(id=='bini')iniRoll()
 else if(id=='bscene'&&!S.busy){startInit();sync()}
 else if(id=='bend'){S.init=null;sync()}
 else if(id=='gen')gen()
 else if(id=='bstart'){S.phase='create';sync()}
 else if(id=='bgo'){S.phase='play';S.init=null;narrate(null,'Comece a aventura com a cena de abertura, apresentando os personagens.')}
 else if(id=='bready'){const s=sheet();s.ready=!s.ready;save(1)}
 else if(d.ap){const[w,k,i,ok]=d.ap.split(',');tx({t:'appr',w,k,id:i,ok:+ok})}
 else if(id=='addc'){S.cards.push({t:'Novo cartão',x:''});sync();render(1)}
 else if(d.delc){S.cards.splice(+d.delc,1);sync();render(1)}
 else if(id=='loadm'){try{cfg.ms=await listModels();if(!cfg.ms.includes(cfg.m))cfg.m=cfg.ms[0]||'';LS('cfg',cfg);render(1);toast(cfg.ms.length+' modelos carregados')}catch(e){toast('Erro: '+e.message)}}
 else if(d.a){const[k,n,v]=d.a.split('|'),s=sheet(),f=free(s)[k=='attrs'?0:1];s[k][n]=s[k][n]||0;if(+v>0&&f>0)s[k][n]++;else if(+v<0&&s[k][n]>0)s[k][n]--;save(1)}
 else if(d.add){const s=sheet(),k=d.add,lim=k=='powers'?S.world.freePw:S.world.freeTr;if(S.phase=='create'&&s[k].length>=lim)return toast(`Limite grátis na criação: ${lim}.`);s[k].push(k=='powers'?{id:rid(),n:'',d:'',lvl:1,stat:attrs()[0]?.n||'',kind:'atk',dice:'1d8',cost:1,st:'pend'}:{id:rid(),n:'',d:'',st:'pend'});save(1)}
 else if(d.del){const[k,i]=d.del.split('.');sheet()[k].splice(+i,1);save(1)}
});
document.addEventListener('change',e=>{
 const t=e.target,d=t.dataset,v=t.type=='number'?+t.value:t.value;
 if(t.id=='avf'&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=96;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,96,96);sheet().avatar=c.toDataURL('image/jpeg',.75);save(1)};im.src=r.result};r.readAsDataURL(t.files[0])}
 else if(d.w){S.world[d.w]=v;sync()}
 else if(d.c){const[i,f]=d.c.split('.');S.cards[i][f]=v;sync()}
 else if(d.s){sheet()[d.s]=v;save()}
 else if(d.pw||d.tr){const[i,f]=(d.pw||d.tr).split('.');sheet()[d.pw?'powers':'traits'][i][f]=v;save(f=='kind')}
 else if(d.cf){if(d.cf=='k')cfg.ks[cfg.p]=v;else{cfg[d.cf]=v;if(d.cf=='p'){cfg.ms=[];cfg.m=''}}LS('cfg',cfg);if(d.cf=='p')render(1)}
});
$('#app').innerHTML=lobby();
</script></body></html>
