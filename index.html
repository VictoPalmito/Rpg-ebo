<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa Infinita — RPG narrado por IA</title>

<style>
:root{--bg:#121a24;--p:#1b2735;--l:#2f4156;--t:#e6e2d6;--m:#8a9aab;--a:#f2b84b;--ok:#6fcf97;--ko:#eb6b5e}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 var(--f,system-ui,sans-serif)}
#app{max-width:780px;margin:0 auto;padding:12px}main{padding-bottom:110px}
h1,h3{font-family:Spectral,Georgia,serif;margin:.2em 0}h1{font-size:26px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}#head{position:relative;z-index:2}
button,input,select,textarea{font:inherit;color:inherit;background:var(--p);border:1px solid var(--l);border-radius:6px;padding:8px 10px}
input,select,textarea{width:100%}textarea{resize:vertical}
input:disabled,select:disabled,textarea:disabled{opacity:.65}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--a)}button:disabled{opacity:.4;cursor:default}

.card{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:12px;margin:10px 0}
.card input,.card textarea,.card select{background:var(--bg)}
.m{color:var(--m)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.chip{display:inline-block;padding:2px 10px;border:1px solid var(--l);border-radius:999px;font-size:13px;margin:2px;background:var(--p)}
.chip img{width:18px;height:18px;border-radius:50%;vertical-align:-4px;margin-right:4px}
.chip.off{opacity:.4}.chip.cur,.chip.sel{background:var(--a);color:#1a1205;border-color:var(--a);font-weight:600}
.ib{margin:8px 0;padding:8px;border:1px dashed var(--a);border-radius:8px;text-align:center}.ap{text-align:left}

@keyframes tyIn{from{opacity:0}to{opacity:1}}@keyframes tyFade{from{opacity:0}to{opacity:1}}@keyframes tyBlur{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:blur(0)}}@keyframes tyRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.typ{color:var(--m);font-style:italic;display:flex;align-items:center;gap:8px}

.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}

@keyframes rot{to{transform:rotate(360deg)}}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.btns button{flex:1}
.cd{border-top:1px solid var(--l);padding-top:8px;margin-top:8px}
.ar{display:grid;grid-template-columns:1fr auto 3ch auto;gap:8px;align-items:center;margin:6px 0}.ar span{text-align:center;font-weight:600}
.bar{position:relative;height:18px;background:var(--bg);border-radius:9px;overflow:hidden;margin:4px 0}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .4s}.bar span{position:relative;font-size:12px;padding-left:8px;line-height:18px;text-shadow:0 1px 2px #000}
.hd{display:flex;gap:12px;align-items:center}.av{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--bg);border:2px solid var(--l);cursor:pointer;display:grid;place-items:center;flex:none;overflow:hidden}
#roll{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px;display:flex;justify-content:center;pointer-events:none}

.rq h2{margin:0;font:600 22px Spectral,serif;color:var(--a)}.rq p{margin:4px 0}.rq button{width:100%;font-size:18px;padding:12px;margin-top:6px}.rq.w{animation:none;border-color:var(--l);padding:8px}
@keyframes gl{0%,100%{box-shadow:0 0 0 0 #f2b84b88}50%{box-shadow:0 0 22px 4px #f2b84b88}}
#toast{position:fixed;bottom:110px;left:50%;transform:translate(-50%,20px);background:var(--a);color:#1a1205;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:10}
#toast.on{opacity:1;transform:translate(-50%,0)}
#dice{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:9}#dice.on{display:grid}
.dw{text-align:center}.dw p{margin:8px 0;font-size:18px;min-height:1.5em}#dr{font-weight:700;font-size:20px}

.f{fill:var(--dc,var(--a));transition:fill .3s}#dn{position:absolute;inset:0;display:grid;place-items:center;color:#1a1205;font:700 42px Spectral,serif}
.die.roll{animation:tb 1s cubic-bezier(.3,.6,.4,1) both}.die.land{animation:ld .45s ease-out}
@keyframes tb{0%{transform:translateY(-140px) rotate(0) scale(.6)}40%{transform:translateY(0) rotate(420deg) scale(1.1)}55%{transform:translateY(-45px) rotate(560deg)}75%{transform:translateY(0) rotate(680deg)}100%{transform:rotate(720deg)}}
@keyframes ld{0%{transform:scale(1.35)}60%{transform:scale(.94)}100%{transform:scale(1)}}
#dice.ok .f{fill:var(--ok)}#dice.ko .f{fill:var(--ko)}#dice.n1 .f{fill:var(--cf,#a33)}#dice.n20 .f{fill:var(--cc,#ffe08a)}#dice.n20 .die{filter:drop-shadow(0 0 24px var(--cc,#ffd54a))}#dice.n1 .die{filter:drop-shadow(0 0 24px var(--cf,#a33))}
#dice.ok #dr{color:var(--ok)}#dice.ko #dr,#dice.n1 #dr{color:var(--ko)}#dice.n20 #dr{color:#ffe08a}

#bgc{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4;backdrop-filter:blur(var(--bl,0px));-webkit-mask-image:radial-gradient(ellipse at center,transparent 55%,#000);mask-image:radial-gradient(ellipse at center,transparent 55%,#000);transition:box-shadow .8s}

.fd{animation:fi .3s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}button{transition:transform .12s,border-color .2s}button:active:not(:disabled){transform:scale(.95)}
.ib.err{border:1px solid var(--ko);color:var(--ko);background:#eb6b5e1f}
button.stt{position:relative;flex:none;overflow:hidden;padding:6px 12px}button.stt i{position:absolute;left:0;bottom:0;height:4px;background:var(--ko)}
.spin{animation:rot 1s linear infinite}.pl{display:inline-block;animation:pl 1.2s ease-in-out infinite}.wob{display:inline-block;animation:wb 1.6s ease-in-out infinite}.flp{display:inline-block;animation:rot 2s steps(4) infinite}
@keyframes pl{50%{transform:scale(1.3);opacity:.6}}@keyframes wb{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
#ld{position:fixed;top:10px;left:50%;transform:translate(-50%,-90px);z-index:30;display:flex;align-items:center;gap:10px;padding:8px 18px;background:var(--p);color:var(--a);border:1px solid var(--a);border-radius:999px;box-shadow:0 4px 20px #0008;transition:transform .35s cubic-bezier(.3,1.4,.5,1);overflow:hidden;pointer-events:none;white-space:nowrap}#ld.on{transform:translate(-50%,0)}#ld button{pointer-events:auto;padding:2px 12px;border-radius:999px;font-size:13px;border-color:var(--ko);color:var(--ko);position:relative;z-index:1}#ld span{color:var(--t)}
#ld i{position:absolute;left:0;bottom:0;height:3px;width:40%;background:var(--a);animation:sh 1.2s ease-in-out infinite}@keyframes sh{from{left:-40%}to{left:100%}}
button.ldg{pointer-events:none;opacity:.75}button:hover:not(:disabled){transform:translateY(-1px)}
.card,.log{background:color-mix(in srgb,var(--p) 80%,transparent);backdrop-filter:blur(5px)}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.prs{transform:scale(.9)!important;box-shadow:0 0 16px var(--a)}

.ei{display:inline-block;animation:fl 3.2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-2px) rotate(10deg)}}

.lt{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#111;font-weight:700;margin-right:4px;vertical-align:-5px}
#mpv{width:100%;height:58vh;display:block;touch-action:none;border-radius:8px}
.die{width:min(92vw,300px);height:220px;margin:auto}#dcv{width:100%;height:100%}
#dcb{min-height:34px;font:700 26px Spectral,serif;color:var(--a);letter-spacing:.08em;animation:pl 1.2s infinite}

.csw{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 10px}

.cpv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}

.ti-heart,.ti-heart-broken,.ti-x{color:var(--ko)}.ti-heart-plus,.ti-check{color:var(--ok)}.ti-diamond{color:#4a7fc0}.ti-droplet{color:#c0524a}.ti-flame{color:#e8884a}.ti-snowflake{color:#8fd3c8}

.tl{margin-right:.4em}label>.tl{margin-top:0;color:inherit}small>.tl{margin-right:.3em}
.bar span{z-index:1}

.shc h3{margin:2px 4px 8px;font-size:17px}.shq{margin-bottom:8px;background:var(--bg)}.shl{overflow:auto;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}

button,.sb{position:relative;overflow:hidden}
.rpl{position:absolute;display:block;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);pointer-events:none;animation:rpl .6s ease-out forwards}@keyframes rpl{to{transform:scale(1);opacity:0}}

.tr{position:fixed;width:12px;height:12px;margin:-6px;border:2px solid var(--a);border-radius:50%;pointer-events:none;z-index:60;animation:tr .5s ease-out forwards}@keyframes tr{to{transform:scale(5);opacity:0;border-width:1px}}
.tp{position:fixed;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--a);pointer-events:none;z-index:60;animation:tp .55s ease-out forwards}@keyframes tp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{40%{transform:scale(1.08)}}
.ia{width:1.1em;height:1.1em;vertical-align:-.2em;margin-right:.18em}
.ia-atk{color:#eb6b5e}.ia-magic{color:#c9a3ff}.ia-def{color:#6fb7ff}.ia-move{color:#8fd3c8}.ia-stealth{color:#9aa7b5}.ia-look{color:var(--a)}.ia-listen{color:var(--a)}.ia-heal{color:var(--ok)}.ia-open{color:#e8b86a}.ia-talk{color:#f2b84b}.ia-grab{color:#e8884a}.ia-rest{color:#e8884a}.ia-bomb{color:#ff6a2b}.ia-item{color:#c0a070}
.lgd{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid;vertical-align:-1px}

#crp{position:fixed;inset:0;z-index:55;background:#000c;overflow:auto;padding:12px;display:flex}

  function buildRain(){

  function buildWaves(){

  function buildDrone(){

  // walks a short generative melodic phrase over the pentatonic scale

    // tuned to one period of the note; the loop's own resonance supplies the
    // full harmonic series (no separate oscillator partials needed). Damping
    // uses the classic two-tap moving-average filter (y[n]=(x[n]+x[n-1])/2)

  // slowly drifts a shared tonal center (a pentatonic degree) that bells,
  // arp phrases and the pad chord all orbit, so they read as one voice

let CR=null;
const crpWrap=n=>((n+180)%360+360)%360-180;
function crpOpen(f){
 if(!f||!/^image\//.test(f.type))return toast('Escolha um arquivo de imagem.');
 const url=URL.createObjectURL(f),im=new Image();
 im.onerror=()=>{URL.revokeObjectURL(url);toast('Não consegui abrir essa imagem.')};
 im.onload=()=>{
  crpClose();
  CR={im,url,cid:cid(),z:1,r:0,x:0,y:0,P:new Map()};
  const o=document.createElement('div');o.id='crp';
  o.innerHTML=`<div class="card"><h3>Ajustar foto</h3><p class=m style="margin:2px 0 8px;font-size:13px">Arraste para mover. Com dois dedos (ou a roda do mouse) você dá zoom e gira.</p><canvas id=crpc width=480 height=480></canvas>
<label><span>Zoom <b id=crpzv></b></span><input type=range class=cps id=crpz min=20 max=400 step=1></label>
<label><span>Rotação <b id=crprv></b></span><input type=range class=cps id=crpr min=-180 max=180 step=1></label>
<div class=btns><button type=button data-crp=l>↺ 90°</button><button type=button data-crp=rr>↻ 90°</button><button type=button data-crp=reset>Resetar</button></div>
<div class=btns><button type=button data-crp=no>Cancelar</button><button type=button data-crp=ok class=pri>Usar foto</button></div></div>`;
  document.body.append(o);
  const c=$('#crpc');
  c.addEventListener('pointerdown',e=>{c.setPointerCapture?.(e.pointerId);CR.P.set(e.pointerId,[e.clientX,e.clientY]);c.style.cursor='grabbing'});
  c.addEventListener('pointermove',e=>{
   if(!CR||!CR.P.has(e.pointerId))return;
   const w=c.getBoundingClientRect().width,old=[...CR.P.values()];
   CR.P.set(e.pointerId,[e.clientX,e.clientY]);const nw=[...CR.P.values()];
   if(nw.length==1){CR.x+=(nw[0][0]-old[0][0])/w;CR.y+=(nw[0][1]-old[0][1])/w}
   else{
    const[a0,b0]=old,[a1,b1]=nw,d0=Math.hypot(b0[0]-a0[0],b0[1]-a0[1]),d1=Math.hypot(b1[0]-a1[0],b1[1]-a1[1]);
    CR.x+=((a1[0]+b1[0])-(a0[0]+b0[0]))/2/w;CR.y+=((a1[1]+b1[1])-(a0[1]+b0[1]))/2/w;
    if(d0>8&&d1>8){crpZoom(CR.z*d1/d0);crpRot(CR.r+(Math.atan2(b1[1]-a1[1],b1[0]-a1[0])-Math.atan2(b0[1]-a0[1],b0[0]-a0[0]))*180/Math.PI)}
   }

  const up=e=>{CR?.P.delete(e.pointerId);c.style.cursor='grab'};

}
function crpDraw(g,S,pv){
 const{im,z,r,x,y}=CR;
 g.setTransform(1,0,0,1,0,0);g.fillStyle='#121a24';g.fillRect(0,0,S,S);

  g.save();g.fillStyle='rgba(0,0,0,.55)';g.beginPath();g.rect(0,0,S,S);g.moveTo(S-2,S/2);g.arc(S/2,S/2,S/2-2,0,7);g.fill('evenodd');g.restore();
  g.strokeStyle='#f2b84b';g.lineWidth=3;g.beginPath();g.arc(S/2,S/2,S/2-2,0,7);g.stroke();

function touchFx(e,b){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 if(ST.vib!==false)navigator.vibrate?.(b.classList.contains('pri')?14:8);
 if(ST.tfx===false||rm)return;

 const k=document.createElement('div');k.className='tr';k.style.left=e.clientX+'px';k.style.top=e.clientY+'px';document.body.append(k);setTimeout(()=>k.remove(),520);
 for(let i=0;i<6;i++){const p=document.createElement('div'),a=Math.PI*2*i/6+Math.random()*.8,l=24+Math.random()*28;p.className='tp';p.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;--dx:${Math.cos(a)*l|0}px;--dy:${Math.sin(a)*l|0}px`;document.body.append(p);setTimeout(()=>p.remove(),580)}

 else if(x>=0&&y>=0&&x<b.w&&y<b.h&&ST.tfx!==false)(MP.fx=MP.fx||[]).push({k:'c',x,y,c:'#fff',d:350,t:performance.now()})}
function mpFxDraw(g,q){const now=performance.now();g.setTransform(q,0,0,q,0,0);MP.fx=(MP.fx||[]).filter(f=>now-f.t<f.d);
 MP.fx.forEach(f=>{const p=(now-f.t)/f.d;g.save();
  if(f.k=='r'){g.globalAlpha=(1-p)*.8;g.strokeStyle=f.c;g.lineWidth=3*(1-p)+1;g.beginPath();g.arc(f.x,f.y,8+p*f.r,0,7);g.stroke()}

  else{g.translate(MP.x,MP.y);const Z=CS*MP.z;g.globalAlpha=(1-p)*.5;g.fillStyle=f.c;g.fillRect(f.x*Z+1,f.y*Z+1,Z-2,Z-2)}
